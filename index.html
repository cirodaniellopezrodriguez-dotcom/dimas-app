<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas - Asistente Norteño</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid #333;
        }
        h2 {
            margin-top: 0;
            color: #ff5252;
            font-size: 22px;
        }
        p {
            font-size: 15px;
            color: #b0b0b0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #ff5252;
        }
        button {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 6px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:active {
            background-color: #ff1744;
        }
        .btn-grupo {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-grupo button {
            background-color: #333;
            font-size: 14px;
        }
        #response-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #252525;
            border-radius: 8px;
            font-style: italic;
            color: #ffccbc;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤠 Dimas Norteño</h2>
        <p id="status-text">¡Fierro, compadre! Al habla.</p>

        <input type="text" id="userInput" placeholder="Escribe o dicta aquí, viejo..." />
        
        <button onclick="procesarTextoInput()">Enviar comando 🚀</button>

        <div class="btn-grupo">
            <button onclick="ejecutarComando('hola')">👋 Saludar</button>
            <button onclick="ejecutarComando('reproducir cadetes de linares')">🎵 Música</button>
        </div>

        <div id="response-box">Escribe un comando o usa los botones, viejo.</div>
    </div>

    <script>
        // Memoria de la conversación para que Dimas se adapte
        let historialChat = [];

        function hablarDimas(texto) {
            if ('speechSynthesis' in window) {
                // Cancelar cualquier voz anterior para que hable al putazo
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-MX'; // Español México
                utterance.rate = 1.0;     // Velocidad normal
                utterance.pitch = 0.9;    // Tono un poco más recio/grueso
                window.speechSynthesis.speak(utterance);
            }
        }

        function ejecutarComando(texto) {
            const textoLower = texto.toLowerCase();
            const responseBox = document.getElementById("response-box");
            let respuesta = "";

            // Guardar en la memoria la orden del usuario
            historialChat.push({ de: 'usuario', texto: texto });

            if (textoLower.includes("reproducir") || textoLower.includes("música") || textoLower.includes("canción") || textoLower.includes("rola")) {
                let busqueda = textoLower.replace("reproducir", "").replace("música", "").replace("canción", "").replace("rola", "").trim();
                if (busqueda) {
                    respuesta = `¡Arre! Abriendo '${busqueda}' en YouTube, viejo.`;
                    let url = `https://www.youtube.com/results?search_query=${encodeURIComponent(busqueda)}`;
                    window.open(url, '_blank');
                } else {
                    respuesta = "¿Qué rola quieres que ponga o qué? Dímela bien, viejo.";
                }
            } else if (textoLower.includes("hola") || textoLower.includes("que onda")) {
                respuesta = "¡Qué onda, compadre! ¿Qué vamos a hacer o qué?";
            } else if (textoLower.includes("nombre")) {
                respuesta = "Yo soy Dimas, tu asistente personal con todo el estilo norteño.";
            } else if (historialChat.length > 3) {
                // Dimas se adapta basándose en que ya llevan cotorreando un rato
                respuesta = `A ver, compadre, sobre eso que me dices de '${texto}', ¡le seguimos dando con todo al proyecto!`;
            } else {
                respuesta = `Recibí tu orden, viejo: '${texto}'. A darle recio.`;
            }

            // Mostrar en pantalla y hablar en voz alta
            responseBox.innerText = `Dimas dice: ${respuesta}`;
            hablarDimas(respuesta);

            // Guardar respuesta de Dimas en la memoria
            historialChat.push({ de: 'dimas', texto: respuesta });
        }

        function procesarTextoInput() {
            const input = document.getElementById("userInput");
            const texto = input.value.trim();
            if (texto) {
                ejecutarComando(texto);
                input.value = "";
            }
        }

        // Enviar con la tecla Enter
        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                procesarTextoInput();
            }
        });
    </script>

</body>
</html>
