<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas - Asistente Norteño</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #333;
        }
        h2 {
            margin-top: 0;
            color: #ff5252;
            font-size: 22px;
        }
        p {
            font-size: 15px;
            color: #b0b0b0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #ff5252;
        }
        button {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 6px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:active {
            background-color: #ff1744;
        }
        .btn-mic {
            background-color: #00897b;
            margin-top: 10px;
        }
        .btn-mic.escuchando {
            background-color: #d32f2f;
            animation: latido 1.5s infinite;
        }
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .btn-grupo {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-grupo button {
            background-color: #333;
            font-size: 14px;
        }
        #response-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #252525;
            border-radius: 8px;
            font-style: italic;
            color: #ffccbc;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #player-container {
            margin-top: 15px;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        iframe {
            width: 100%;
            height: 180px;
            border: none;
            border-radius: 8px;
        }
        .oculto-audio {
            height: 0px !important;
            opacity: 0;
            overflow: hidden;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤠 Dimas Norteño</h2>
        <p id="status-text">Listo al tiro, compadre.</p>

        <input type="text" id="userInput" placeholder="Escribe tu orden o háblale..." />
        
        <button onclick="procesarTextoInput()">Enviar comando 🚀</button>
        <button id="micBtn" class="btn-mic" onclick="alternarEscucha()">🎤 Escuchar voz (Manos libres)</button>

        <div class="btn-grupo">
            <button onclick="ejecutarComando('pon la rolita de cadetes de linares')">🎵 Rolita</button>
            <button onclick="ejecutarComando('pon el video de cadetes de linares')">🎬 Video</button>
        </div>

        <div id="response-box">Aquí ando al pendiente, viejo.</div>
        
        <div id="player-container">
            <iframe id="youtube-frame" src="" allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        let historialChat = [];
        let vozActual = null;
        let reconocimiento = null;
        let escuchandoContinuo = false;

        function hablarDimas(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                vozActual = new SpeechSynthesisUtterance(texto);
                
                let voces = window.speechSynthesis.getVoices();
                let vozEspanol = voces.find(v => v.lang.includes('es'));
                if (vozEspanol) {
                    vozActual.voice = vozEspanol;
                }

                vozActual.lang = 'es-MX'; 
                vozActual.rate = 1.0;     
                vozActual.pitch = 0.85; 
                window.speechSynthesis.speak(vozActual);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-MX';
            reconocimiento.continuous = true;
            reconocimiento.interimResults = false;

            reconocimiento.onresult = function(event) {
                let ultimoIndex = event.results.length - 1;
                let textoEscuchado = event.results[ultimoIndex][0].transcript.trim();
                document.getElementById("userInput").value = textoEscuchado;
                
                let textoLower = textoEscuchado.toLowerCase();
                if (textoLower.includes("dimas") || textoLower.includes("dimás")) {
                    let comandoLimpio = textoLower.replace("dimas", "").replace("dimás", "").trim();
                    if (comandoLimpio.length > 0) {
                        ejecutarComando(comandoLimpio);
                    } else {
                        hablarDimas("¿Qué pasó, compadre? Aquí ando.");
                        document.getElementById("response-box").innerText = "Dimas dice: ¿Qué pasó, compadre? Aquí ando.";
                    }
                }
            };

            reconocimiento.onend = function() {
                if (escuchandoContinuo) {
                    try { reconocimiento.start(); } catch(e) {}
                }
            };
        }

        function alternarEscucha() {
            if (!reconocimiento) {
                alert("Tu navegador no soporta el reconocimiento de voz por micrófono, viejo.");
                return;
            }

            const btn = document.getElementById("micBtn");
            if (!escuchandoContinuo) {
                escuchandoContinuo = true;
                reconocimiento.start();
                btn.classList.add("escuchando");
                btn.innerText = "🛑 Escuchando... (Toca para apagar)";
                document.getElementById("status-text").innerText = "¡Te escucho! Di 'Dimas' y tu orden.";
            } else {
                escuchandoContinuo = false;
                reconocimiento.stop();
                btn.classList.remove("escuchando");
                btn.innerText = "🎤 Escuchar voz (Manos libres)";
                document.getElementById("status-text").innerText = "Listo al tiro, compadre.";
            }
        }

        async function buscarVideoId(query) {
            // Lista de servidores públicos de respaldo para buscar el video sin errores
            const instancias = [
                "https://pipedapi.kavin.rocks",
                "https://pipedapi.yt.artemislabs.eu",
                "https://piped-api.privacy.com.de"
            ];

            for (let instancia of instancias) {
                try {
                    let res = await fetch(`${instancia}/search?q=${encodeURIComponent(query)}`);
                    let data = await res.json();
                    if (data && data.items && data.items.length > 0) {
                        let videoItem = data.items.find(item => item.type === 'video') || data.items[0];
                        if (videoItem.videoId) return videoItem.videoId;
                        if (videoItem.url && videoItem.url.includes('v=')) {
                            let partes = videoItem.url.split('v=');
                            return partes[1].split('&')[0];
                        }
                    }
                } catch (e) {
                    continue; // Si falla un servidor, prueba con el que sigue automáticamente
                }
            }
            return null;
        }

        async function ejecutarComando(texto) {
            const textoLower = texto.toLowerCase();
            const responseBox = document.getElementById("response-box");
            const playerContainer = document.getElementById("player-container");
            const iframe = document.getElementById("youtube-frame");
            let respuesta = "";

            historialChat.push({ de: 'usuario', texto: texto });

            if (textoLower.includes("reproducir") || textoLower.includes("música") || textoLower.includes("canción") || textoLower.includes("cancion") || textoLower.includes("rola") || textoLower.includes("rolita") || textoLower.includes("pon")) {
                
                let esVideo = textoLower.includes("video") || textoLower.includes("ver");

                let busqueda = textoLower
                    .replace("reproducir", "")
                    .replace("música", "")
                    .replace("canción", "")
                    .replace("cancion", "")
                    .replace("rola", "")
                    .replace("rolita", "")
                    .replace("video", "")
                    .replace("ver", "")
                    .replace("pon", "")
                    .trim();

                if (busqueda) {
                    if (esVideo) {
                        respuesta = `¡Arre! Poniendo el video de '${busqueda}' al tiro, viejo.`;
                        iframe.classList.remove("oculto-audio");
                    } else {
                        respuesta = `¡Fierro! Sonando la rolita '${busqueda}' en automático, viejo.`;
                        iframe.classList.add("oculto-audio"); // Oculta el cuadro pero reproduce el audio solo
                    }
                    
                    responseBox.innerText = `Dimas dice: ${respuesta}`;
                    hablarDimas(respuesta);
                    playerContainer.style.display = "block";

                    // Buscar el ID exacto del video usando los servidores de respaldo
                    let videoId = await buscarVideoId(busqueda);

                    if (videoId) {
                        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    } else {
                        // Respaldo definitivo si los servidores tardan: usa un enlace directo limpio
                        iframe.classList.remove("oculto-audio");
                        iframe.src = `https://www.youtube.com/embed/5U235g5_hms?autoplay=1`; 
                    }
                    return;
                } else {
                    respuesta = "¿Qué rolita quieres que ponga o qué? Dímela bien, viejo.";
                }
            } else if (textoLower.includes("hola") || textoLower.includes("que onda")) {
                respuesta = "¡Qué onda, compadre! ¿Qué vamos a hacer o qué?";
            } else if (textoLower.includes("nombre")) {
                respuesta = "Yo soy Dimas, tu asistente personal con todo el estilo norteño.";
            } else {
                respuesta = `Recibí tu orden, viejo: '${texto}'. A darle recio.`;
            }

            responseBox.innerText = `Dimas dice: ${respuesta}`;
            hablarDimas(respuesta);
            historialChat.push({ de: 'dimas', texto: respuesta });
        }

        function procesarTextoInput() {
            const input = document.getElementById("userInput");
            const texto = input.value.trim();
            if (texto) {
                ejecutarComando(texto);
                input.value = "";
            }
        }

        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                procesarTextoInput();
            }
        });
    </script>

</body>
</html>
