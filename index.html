<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #333;
        }
        h2 {
            margin-top: 0;
            color: #ff5252;
            font-size: 22px;
        }
        p {
            font-size: 15px;
            color: #b0b0b0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #ff5252;
        }
        button {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 6px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:active {
            background-color: #ff1744;
        }
        .btn-mic {
            background-color: #00897b;
            margin-top: 10px;
        }
        .btn-mic.escuchando {
            background-color: #d32f2f;
            animation: latido 1.5s infinite;
        }
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .btn-grupo {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-grupo button {
            background-color: #333;
            font-size: 14px;
        }
        #response-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #252525;
            border-radius: 8px;
            font-style: italic;
            color: #ffccbc;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤠 Dimas</h2>
        <p id="status-text">Listo al tiro, compadre.</p>

        <input type="text" id="userInput" placeholder="Escribe tu orden o háblale..." />
        
        <button onclick="procesarTextoInput()">Enviar comando 🚀</button>
        <button id="micBtn" class="btn-mic" onclick="alternarEscucha()">🎤 Escuchar voz (Manos libres)</button>

        <div class="btn-grupo">
            <button onclick="ejecutarComando('pon una alarma a las 7 de la mañana')">⏰ Alarma</button>
            <button onclick="ejecutarComando('pon la rolita de cadetes de linares')">🎵 Rolita</button>
        </div>

        <div id="response-box">Aquí ando al pendiente, viejo. Pruebe a hablarme.</div>
    </div>

    <script>
        let vozActual = null;
        let reconocimiento = null;
        let escuchando = false;

        function hablarDimas(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                vozActual = new SpeechSynthesisUtterance(texto);
                
                let voces = window.speechSynthesis.getVoices();
                let vozEspanol = voces.find(v => v.lang === 'es-MX' || v.lang.includes('es-US') || v.lang.includes('es-LA')) || voces.find(v => v.lang.includes('es'));
                if (vozEspanol) {
                    vozActual.voice = vozEspanol;
                }

                vozActual.lang = 'es-MX'; 
                vozActual.rate = 1.05; 
                vozActual.pitch = 0.95; 
                window.speechSynthesis.speak(vozActual);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-MX';
            reconocimiento.continuous = false; // Evita que se quede colgado en Android
            reconocimiento.interimResults = false;

            reconocimiento.onresult = function(event) {
                let textoEscuchado = event.results[0][0].transcript.trim();
                document.getElementById("userInput").value = textoEscuchado;
                detenerEscuchaUI();
                ejecutarComando(textoEscuchado);
            };

            reconocimiento.onerror = function(event) {
                detenerEscuchaUI();
                document.getElementById("response-box").innerText = "Dimas dice: No alcancé a oír bien, viejo.";
            };

            reconocimiento.onend = function() {
                detenerEscuchaUI();
            };
        }

        function alternarEscucha() {
            if (!reconocimiento) {
                alert("Tu navegador no soporta el reconocimiento de voz por micrófono, viejo.");
                return;
            }

            const btn = document.getElementById("micBtn");
            if (!escuchando) {
                try {
                    escuchando = true;
                    reconocimiento.start();
                    btn.classList.add("escuchando");
                    btn.innerText = "🛑 Escuchando... (Hable ahora)";
                    document.getElementById("status-text").innerText = "Te escucho, compadre...";
                } catch(e) {
                    escuchando = false;
                    detenerEscuchaUI();
                }
            } else {
                try {
                    reconocimiento.stop();
                } catch(e) {}
                detenerEscuchaUI();
            }
        }

        function detenerEscuchaUI() {
            escuchando = false;
            const btn = document.getElementById("micBtn");
            if (btn) {
                btn.classList.remove("escuchando");
                btn.innerText = "🎤 Escuchar voz (Manos libres)";
            }
            const status = document.getElementById("status-text");
            if (status) {
                status.innerText = "Listo al tiro, compadre.";
            }
        }

        function ejecutarComando(texto) {
            const textoLower = texto.toLowerCase();
            const responseBox = document.getElementById("response-box");
            let respuesta = "";

            // Limpiar mención de "dimas" si la incluye al hablar
            let comandoLimpio = textoLower.replace("dimas", "").replace("dimás", "").trim();

            if (comandoLimpio.includes("reproducir") || comandoLimpio.includes("música") || comandoLimpio.includes("canción") || comandoLimpio.includes("cancion") || comandoLimpio.includes("rola") || comandoLimpio.includes("rolita") || comandoLimpio.includes("pon")) {
                
                let busqueda = comandoLimpio
                    .replace("reproducir", "")
                    .replace("música", "")
                    .replace("canción", "")
                    .replace("cancion", "")
                    .replace("rola", "")
                    .replace("rolita", "")
                    .replace("video", "")
                    .replace("ver", "")
                    .replace("pon", "")
                    .trim();

                if (busqueda) {
                    respuesta = `¡Fierro! Buscando '${busqueda}' al tiro, viejo.`;
                    responseBox.innerText = `Dimas dice: ${respuesta}`;
                    hablarDimas(respuesta);

                    setTimeout(() => {
                        let query = encodeURIComponent(busqueda);
                        let url = `https://www.youtube.com/results?search_query=${query}`;
                        window.location.href = url;
                    }, 1200);
                    return;
                } else {
                    respuesta = "¿Qué rolita quieres que ponga o qué? Dímela bien, viejo.";
                }
            } 
            else if (comandoLimpio.includes("alarma") || comandoLimpio.includes("despertador")) {
                respuesta = "¡Arre pues! Abriendo la aplicación de reloj para programar tu alarma, viejo.";
                responseBox.innerText = `Dimas dice: ${respuesta}`;
                hablarDimas(respuesta);

                setTimeout(() => {
                    if (/Android/i.test(navigator.userAgent)) {
                        window.location.href = "intent://#Intent;action=android.intent.action.SET_ALARM;end;";
                    } else {
                        window.open("https://calendar.google.com", "_blank");
                    }
                }, 1200);
                return;
            } 
            else if (comandoLimpio.includes("cronómetro") || comandoLimpio.includes("temporizador")) {
                respuesta = "¡Fierro! Abriendo el cronómetro en chiza, viejo.";
                responseBox.innerText = `Dimas dice: ${respuesta}`;
                hablarDimas(respuesta);

                setTimeout(() => {
                    if (/Android/i.test(navigator.userAgent)) {
                        window.location.href = "intent://#Intent;action=android.intent.action.SET_TIMER;end;";
                    } else {
                        alert("Cronómetro solicitado, compadre.");
                    }
                }, 1200);
                return;
            }
            else if (comandoLimpio.includes("hola") || comandoLimpio.includes("que onda")) {
                respuesta = "¡Qué onda, compadre! ¿Qué vamos a hacer o qué? Aquí ando al pendiente.";
            } else if (comandoLimpio.includes("nombre")) {
                respuesta = "Yo soy Dimas, tu asistente personal al tiro.";
            } else {
                respuesta = `Recibí tu orden, viejo: '${texto}'. A darle recio con eso.`;
            }

            responseBox.innerText = `Dimas dice: ${respuesta}`;
            hablarDimas(respuesta);
        }

        function procesarTextoInput() {
            const input = document.getElementById("userInput");
            const texto = input.value.trim();
            if (texto) {
                ejecutarComando(texto);
                input.value = "";
            }
        }

        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                procesarTextoInput();
            }
        });
    </script>

</body>
</html>
