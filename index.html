<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #333;
        }
        h2 {
            margin-top: 0;
            color: #ff5252;
            font-size: 22px;
        }
        p {
            font-size: 15px;
            color: #b0b0b0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #ff5252;
        }
        button {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 6px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:active {
            background-color: #ff1744;
        }
        .btn-mic {
            background-color: #00897b;
            margin-top: 10px;
        }
        .btn-mic.escuchando {
            background-color: #d32f2f;
            animation: latido 1.5s infinite;
        }
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        #response-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #252525;
            border-radius: 8px;
            font-style: italic;
            color: #ffccbc;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-descanso { background-color: #333; color: #aaa; }
        .badge-activo { background-color: #00897b; color: #fff; animation: latido 1.5s infinite; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤠 Dimas</h2>
        <div id="status-badge" class="status-badge badge-descanso">Listo al tiro</div>
        <p id="status-text">Pícale al botón para hablar directo o activa el manos libres.</p>

        <input type="text" id="userInput" placeholder="Escribe tu orden o háblale..." />
        
        <button onclick="procesarTextoInput()">Enviar comando 🚀</button>
        <button id="micBtn" class="btn-mic" onclick="hablarDirecto()">🎤 Toca y habla (Directo)</button>
        <button id="manosLibresBtn" style="background-color: #333; font-size: 14px; margin-top: 5px;" onclick="alternarManosLibres()">🔴 Activar Manos Libres ("Dimas")</button>

        <div id="response-box">Aquí ando al pendiente, viejo.</div>
    </div>

    <script>
        let vozActual = null;
        let reconocimiento = null;
        let modoManosLibres = false;
        let estaHablandoDimas = false;

        function hablarDimas(texto, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                estaHablandoDimas = true;
                
                if (reconocimiento) {
                    try { reconocimiento.stop(); } catch(e) {}
                }

                vozActual = new SpeechSynthesisUtterance(texto);
                let voces = window.speechSynthesis.getVoices();
                let vozEspanol = voces.find(v => v.lang === 'es-MX' || v.lang.includes('es-US') || v.lang.includes('es-LA')) || voces.find(v => v.lang.includes('es'));
                if (vozEspanol) {
                    vozActual.voice = vozEspanol;
                }

                vozActual.lang = 'es-MX'; 
                vozActual.rate = 1.05; 
                vozActual.pitch = 0.95; 

                vozActual.onend = function() {
                    estaHablandoDimas = false;
                    if (callback) callback();
                };

                vozActual.onerror = function() {
                    estaHablandoDimas = false;
                    if (callback) callback();
                };

                window.speechSynthesis.speak(vozActual);
            } else if (callback) {
                callback();
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        // Crear una sola instancia limpia de reconocimiento
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-MX';
            reconocimiento.continuous = false;
            reconocimiento.interimResults = false;

            reconocimiento.onresult = function(event) {
                if (estaHablandoDimas) return;

                let textoEscuchado = event.results[0][0].transcript.trim().toLowerCase();
                document.getElementById("userInput").value = textoEscuchado;

                restaurarBotonesUI();

                if (modoManosLibres) {
                    // Si está activo el manos libres, evaluamos si dijo "Dimas"
                    if (textoEscuchado.includes("dimas") || textoEscuchado.includes("dimás")) {
                        let ordenReal = textoEscuchado.replace("dimas", "").replace("dimás", "").trim();
                        if (ordenReal.length > 0) {
                            ejecutarComando(ordenReal);
                        } else {
                            hablarDimas("¿Qué pasó, compadre?", () => {
                                reiniciarManosLibres();
                            });
                        }
                    } else {
                        reiniciarManosLibres();
                    }
                } else {
                    // Si fue toque directo al botón, ejecutamos la orden al putazo
                    ejecutarComando(textoEscuchado);
                }
            };

            reconocimiento.onerror = function(event) {
                restaurarBotonesUI();
                if (modoManosLibres) {
                    setTimeout(reiniciarManosLibres, 1000);
                }
            };

            reconocimiento.onend = function() {
                restaurarBotonesUI();
                if (modoManosLibres) {
                    setTimeout(reiniciarManosLibres, 500);
                }
            };
        }

        // Botón de Toca y Habla Directo (Sin depender de decir "Dimas")
        function hablarDirecto() {
            if (!reconocimiento) {
                alert("Tu navegador no soporta el reconocimiento de voz, viejo.");
                return;
            }
            if (estaHablandoDimas) return;

            modoManosLibres = false; // Apagamos manos libres para evitar conflictos
            const btn = document.getElementById("micBtn");
            btn.classList.add("escuchando");
            btn.innerText = "🛑 Escuchando... (Hable ahora)";
            document.getElementById("status-text").innerText = "Te escucho, di tu orden...";

            try {
                reconocimiento.abort(); // Forzar reinicio limpio
                reconocimiento.start();
            } catch(e) {
                restaurarBotonesUI();
            }
        }

        // Botón independiente para el modo Manos Libres ("Dimas")
        function alternarManosLibres() {
            if (!reconocimiento) {
                alert("Tu navegador no soporta el reconocimiento de voz, viejo.");
                return;
            }

            const btnML = document.getElementById("manosLibresBtn");
            if (!modoManosLibres) {
                modoManosLibres = true;
                btnML.style.backgroundColor = "#00897b";
                btnML.innerText = "🛑 Desactivar Manos Libres";
                document.getElementById("status-badge").className = "status-badge badge-activo";
                document.getElementById("status-badge").innerText = "Modo Manos Libres Activo";
                document.getElementById("status-text").innerText = "Di 'Dimas' seguido de tu orden.";
                reiniciarManosLibres();
            } else {
                modoManosLibres = false;
                try { reconocimiento.stop(); } catch(e) {}
                btnML.style.backgroundColor = "#333";
                btnML.innerText = "🔴 Activar Manos Libres ('Dimas')";
                document.getElementById("status-badge").className = "status-badge badge-descanso";
                document.getElementById("status-badge").innerText = "Listo al tiro";
                document.getElementById("status-text").innerText = "Pícale al botón para hablar directo.";
            }
        }

        function reiniciarManosLibres() {
            if (modoManosLibres && !estaHablandoDimas) {
                try {
                    reconocimiento.abort();
                    setTimeout(() => {
                        if (modoManosLibres && !estaHablandoDimas) {
                            reconocimiento.start();
                        }
                    }, 300);
                } catch(e) {}
            }
        }

        function restaurarBotonesUI() {
            const btn = document.getElementById("micBtn");
            btn.classList.remove("escuchando");
            btn.innerText = "🎤 Toca y habla (Directo)";
            if (!modoManosLibres) {
                document.getElementById("status-text").innerText = "Pícale al botón para hablar directo o activa el manos libres.";
            }
        }

        function hacerBiip() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880; 
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.0); 
            } catch(e) {}
        }

        function convertirNumeroEscrito(texto) {
            const mapaNumeros = {
                'un': 1, 'uno': 1, 'una': 1, 'dos': 2, 'tres': 3, 'cuatro': 4, 
                'cinco': 5, 'seis': 6, 'siete': 7, 'ocho': 8, 'nueve': 9, 'diez': 10,
                'quince': 15, 'veinte': 20, 'treinta': 30
            };
            let limpio = texto;
            for (let palabra in mapaNumeros) {
                let regex = new RegExp('\\b' + palabra + '\\b', 'g');
                limpio = limpio.replace(regex, mapaNumeros[palabra]);
            }
            return limpio;
        }

        function ejecutarComando(texto) {
            const responseBox = document.getElementById("response-box");
            let respuesta = "";

            let comandoLimpio = texto.replace("dimas", "").replace("dimás", "").trim();
            comandoLimpio = convertirNumeroEscrito(comandoLimpio);

            // 1. CRONÓMETRO / TEMPORIZADOR
            if (comandoLimpio.includes("cronómetro") || comandoLimpio.includes("temporizador") || comandoLimpio.includes("cuenta regresiva")) {
                
                let matchMin = comandoLimpio.match(/(\d+(?:\.\d+)?)\s*(minuto|minutos|min)/);
                let matchSeg = comandoLimpio.match(/(\d+)\s*(segundo|segundos|seg)/);
                
                let milisegundos = 60 * 1000; 
                let textoTiempo = "1 minuto";

                if (matchMin) {
                    let mins = parseFloat(matchMin[1]);
                    milisegundos = mins * 60 * 1000;
                    textoTiempo = `${mins} minuto${mins > 1 ? 's' : ''}`;
                } else if (matchSeg) {
                    let segs = parseInt(matchSeg[1]);
                    milisegundos = segs * 1000;
                    textoTiempo = `${segs} segundo${segs > 1 ? 's' : ''}`;
                }

                respuesta = `¡Fierro! Cronómetro puesto de ${textoTiempo}. Yo te aviso cuando caiga el tiempo, viejo.`;
                responseBox.innerText = `Dimas dice: ${respuesta}`;
                
                hablarDimas(respuesta, () => {
                    if (modoManosLibres) reiniciarManosLibres();
                });

                setTimeout(() => {
                    hacerBiip();
                    hablarDimas(`¡Tiempo cumplido, compadre! Se acabó el cronómetro de ${textoTiempo}. ¡Despierta!`);
                    document.getElementById("response-box").innerText = `⏰ ¡TIEMPO CUMPLIDO (${textoTiempo})!`;
                }, milisegundos);

                return;
            } 
            // 2. ALARMA
            else if (comandoLimpio.includes("alarma") || comandoLimpio.includes("despertador")) {
                respuesta = "¡Arre pues! Abriendo el reloj para programar tu alarma, viejo.";
                responseBox.innerText = `Dimas dice: ${respuesta}`;
                hablarDimas(respuesta, () => {
                    setTimeout(() => {
                        if (/Android/i.test(navigator.userAgent)) {
                            window.location.href = "intent://#Intent;action=android.intent.action.SET_ALARM;end;";
                        } else {
                            window.open("https://calendar.google.com", "_blank");
                        }
                        if (modoManosLibres) reiniciarManosLibres();
                    }, 500);
                });
                return;
            } 
            // 3. MÚSICA / ROLITA
            else if (comandoLimpio.includes("reproducir") || comandoLimpio.includes("música") || comandoLimpio.includes("canción") || comandoLimpio.includes("cancion") || comandoLimpio.includes("rola") || comandoLimpio.includes("rolita") || comandoLimpio.includes("pon")) {
                
                let busqueda = comandoLimpio
                    .replace("reproducir", "")
                    .replace("música", "")
                    .replace("canción", "")
                    .replace("cancion", "")
                    .replace("rola", "")
                    .replace("rolita", "")
                    .replace("video", "")
                    .replace("ver", "")
                    .replace("pon", "")
                    .trim();

                if (busqueda) {
                    respuesta = `¡Fierro! Buscando '${busqueda}' para pasarlo a SnapTube, viejo.`;
                    responseBox.innerText = `Dimas dice: ${respuesta}`;
                    hablarDimas(respuesta, () => {
                        setTimeout(() => {
                            let query = encodeURIComponent(busqueda);
                            window.location.href = `https://www.youtube.com/results?search_query=${query}`;
                        }, 500);
                    });
                    return;
                } else {
                    respuesta = "¿Qué rolita quieres que ponga o qué? Dímela bien, viejo.";
                }
            } 
            else if (comandoLimpio.includes("hola") || comandoLimpio.includes("que onda")) {
                respuesta = "¡Qué onda, compadre! ¿Qué vamos a hacer o qué?";
            } else if (comandoLimpio.includes("nombre")) {
                respuesta = "Yo soy Dimas, tu asistente personal al tiro.";
            } else {
                respuesta = `Recibí tu orden, viejo: '${texto}'. A darle recio.`;
            }

            responseBox.innerText = `Dimas dice: ${respuesta}`;
            hablarDimas(respuesta, () => {
                if (modoManosLibres) reiniciarManosLibres();
            });
        }

        function procesarTextoInput() {
            const input = document.getElementById("userInput");
            const texto = input.value.trim();
            if (texto) {
                ejecutarComando(texto);
                input.value = "";
            }
        }

        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                procesarTextoInput();
            }
        });
    </script>

</body>
</html>
