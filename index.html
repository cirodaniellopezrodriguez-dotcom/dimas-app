<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas - Manos Libres</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #333;
        }
        h2 {
            margin-top: 0;
            color: #ff5252;
            font-size: 22px;
        }
        p {
            font-size: 15px;
            color: #b0b0b0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #ff5252;
        }
        button {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 14px 20px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:active {
            background-color: #ff1744;
        }
        .btn-manos-libres {
            background-color: #00897b;
        }
        .btn-manos-libres.activo {
            background-color: #d32f2f;
            animation: latido 1.5s infinite;
        }
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        #response-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #252525;
            border-radius: 8px;
            font-style: italic;
            color: #ffccbc;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-inactivo { background-color: #333; color: #aaa; }
        .badge-activo { background-color: #00897b; color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤠 Dimas</h2>
        <div id="status-badge" class="status-badge badge-inactivo">Manos Libres Apagado</div>
        <p id="status-text">Pícale al botón para iniciar la conversación continua.</p>

        <input type="text" id="userInput" placeholder="Escribe tu orden o háblale..." />
        
        <button onclick="procesarTextoInput()">Enviar comando 🚀</button>
        <button id="mlBtn" class="btn-manos-libres" onclick="alternarManosLibres()">🎙️ Iniciar Manos Libres</button>

        <div id="response-box">Aquí ando al pendiente, viejo.</div>
    </div>

    <script>
        let reconocimiento = null;
        let manosLibresActivo = false;
        let estaHablandoDimas = false;

        function hablarDimas(texto, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                estaHablandoDimas = true;
                
                // Apagamos el micro mientras Dimas habla para evitar que se escuche a sí mismo
                if (reconocimiento) {
                    try { reconocimiento.stop(); } catch(e) {}
                }

                let utterance = new SpeechSynthesisUtterance(texto);
                let voces = window.speechSynthesis.getVoices();
                let vozEspanol = voces.find(v => v.lang === 'es-MX' || v.lang.includes('es-US') || v.lang.includes('es-LA')) || voces.find(v => v.lang.includes('es'));
                if (vozEspanol) {
                    utterance.voice = vozEspanol;
                }

                utterance.lang = 'es-MX'; 
                utterance.rate = 1.05; 
                utterance.pitch = 0.95; 

                utterance.onend = function() {
                    estaHablandoDimas = false;
                    if (callback) callback();
                };

                utterance.onerror = function() {
                    estaHablandoDimas = false;
                    if (callback) callback();
                };

                window.speechSynthesis.speak(utterance);
            } else if (callback) {
                callback();
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-MX';
            reconocimiento.continuous = false;
            reconocimiento.interimResults = false;

            reconocimiento.onresult = function(event) {
                if (estaHablandoDimas) return;

                let textoEscuchado = event.results[0][0].transcript.trim().toLowerCase();
                document.getElementById("userInput").value = textoEscuchado;

                // Ejecutamos la orden de inmediato
                ejecutarComando(textoEscuchado);
            };

            reconocimiento.onerror = function(event) {
                // Si da error por silencio, reiniciamos el ciclo si el manos libres sigue activo
                if (manosLibresActivo && !estaHablandoDimas) {
                    setTimeout(reiniciarEscucha, 600);
                }
            };

            reconocimiento.onend = function() {
                // Al terminar de capturar una frase, si no está hablando Dimas, reabre el micro en automático
                if (manosLibresActivo && !estaHablandoDimas) {
                    setTimeout(reiniciarEscucha, 400);
                }
            };
        }

        function alternarManosLibres() {
            if (!reconocimiento) {
                alert("Tu navegador no soporta el reconocimiento de voz por micrófono, viejo.");
                return;
            }

            const btn = document.getElementById("mlBtn");
            const badge = document.getElementById("status-badge");

            if (!manosLibresActivo) {
                manosLibresActivo = true;
                btn.classList.add("activo");
                btn.innerText = "🛑 Detener Manos Libres";
                badge.className = "status-badge badge-activo";
                badge.innerText = "Manos Libres Activo (Escuchando...)";
                document.getElementById("status-text").innerText = "Te escucho, compadre. Habla con confianza.";
                
                hablarDimas("¡Fierro! Manos libres activado. Dime en qué te ayudo.", () => {
                    reiniciarEscucha();
                });
            } else {
                manosLibresActivo = false;
                try { reconocimiento.stop(); } catch(e) {}
                btn.classList.remove("activo");
                btn.innerText = "🎙️ Iniciar Manos Libres";
                badge.className = "status-badge badge-inactivo";
                badge.innerText = "Manos Libres Apagado";
                document.getElementById("status-text").innerText = "Pícale al botón para iniciar la conversación continua.";
            }
        }

        function reiniciarEscucha() {
            if (manosLibresActivo && !estaHablandoDimas) {
                try {
                    reconocimiento.abort();
                    setTimeout(() => {
                        if (manosLibresActivo && !estaHablandoDimas) {
                            reconocimiento.start();
                        }
                    }, 200);
                } catch(e) {}
            }
        }

        function hacerBiip() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880; 
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.0); 
            } catch(e) {}
        }

        function convertirNumeroEscrito(texto) {
            const mapaNumeros = {
                'un': 1, 'uno': 1, 'una': 1, 'dos': 2, 'tres': 3, 'cuatro': 4, 
                'cinco': 5, 'seis': 6, 'siete': 7, 'ocho': 8, 'nueve': 9, 'diez': 10,
                'quince': 15, 'veinte': 20, 'treinta': 30
            };
            let limpio = texto;
            for (let palabra in mapaNumeros) {
                let regex = new RegExp('\\b' + palabra + '\\b', 'g');
                limpio = limpio.replace(regex, mapaNumeros[palabra]);
            }
            return limpio;
        }

        function ejecutarComando(texto) {
            const responseBox = document.getElementById("response-box");
            let respuesta = "";

            let comandoLimpio = texto.replace("dimas", "").replace("dimás", "").trim();
            comandoLimpio = convertirNumeroEscrito(comandoLimpio);

            // 1. CRONÓMETRO / TEMPORIZADOR
            if (comandoLimpio.includes("cronómetro") || comandoLimpio.includes("temporizador") || comandoLimpio.includes("cuenta regresiva")) {
                
                let matchMin = comandoLimpio.match(/(\d+(?:\.\d+)?)\s*(minuto|minutos|min)/);
                let matchSeg = comandoLimpio.match(/(\d+)\s*(segundo|segundos|seg)/);
                
                let milisegundos = 60 * 1000; 
                let textoTiempo = "1 minuto";

                if (matchMin) {
                    let mins = parseFloat(matchMin[1]);
                    milisegundos = mins * 60 * 1000;
                    textoTiempo = `${mins} minuto${mins > 1 ? 's' : ''}`;
                } else if (matchSeg) {
                    let segs = parseInt(matchSeg[1]);
                    milisegundos = segs * 1000;
                    textoTiempo = `${segs} segundo${segs > 1 ? 's' : ''}`;
                }

                respuesta = `¡Fierro! Cronómetro puesto de ${textoTiempo}. Yo te aviso cuando caiga el tiempo, viejo.`;
                responseBox.innerText = `Dimas dice: ${respuesta}`;
                
                hablarDimas(respuesta, () => {
                    reiniciarEscucha(); // Vuelve a abrir el micro en automático al terminar de hablar
                });

                setTimeout(() => {
                    hacerBiip();
                    hablarDimas(`¡Tiempo cumplido, compadre! Se acabó el cronómetro de ${textoTiempo}. ¡Despierta!`, () => {
                        reiniciarEscucha();
                    });
                    document.getElementById("response-box").innerText = `⏰ ¡TIEMPO CUMPLIDO (${textoTiempo})!`;
                }, milisegundos);

                return;
            } 
            // 2. ALARMA
            else if (comandoLimpio.includes("alarma") || comandoLimpio.includes("despertador")) {
                respuesta = "¡Arre pues! Abriendo el reloj para programar tu alarma, viejo.";
                responseBox.innerText = `Dimas dice: ${respuesta}`;
                hablarDimas(respuesta, () => {
                    setTimeout(() => {
                        if (/Android/i.test(navigator.userAgent)) {
                            window.location.href = "intent://#Intent;action=android.intent.action.SET_ALARM;end;";
                        } else {
                            window.open("https://calendar.google.com", "_blank");
                        }
                        reiniciarEscucha();
                    }, 500);
                });
                return;
            } 
            // 3. MÚSICA / ROLITA
            else if (comandoLimpio.includes("reproducir") || comandoLimpio.includes("música") || comandoLimpio.includes("canción") || comandoLimpio.includes("cancion") || comandoLimpio.includes("rola") || comandoLimpio.includes("rolita") || comandoLimpio.includes("pon")) {
                
                let busqueda = comandoLimpio
                    .replace("reproducir", "")
                    .replace("música", "")
                    .replace("canción", "")
                    .replace("cancion", "")
                    .replace("rola", "")
                    .replace("rolita", "")
                    .replace("video", "")
                    .replace("ver", "")
                    .replace("pon", "")
                    .trim();

                if (busqueda) {
                    respuesta = `¡Fierro! Buscando '${busqueda}' para pasarlo a SnapTube, viejo.`;
                    responseBox.innerText = `Dimas dice: ${respuesta}`;
                    hablarDimas(respuesta, () => {
                        setTimeout(() => {
                            let query = encodeURIComponent(busqueda);
                            window.location.href = `https://www.youtube.com/results?search_query=${query}`;
                        }, 500);
                    });
                    return;
                } else {
                    respuesta = "¿Qué rolita quieres que ponga o qué? Dímela bien, viejo.";
                }
            } 
            else if (comandoLimpio.includes("hola") || comandoLimpio.includes("que onda")) {
                respuesta = "¡Qué onda, compadre! ¿Qué vamos a hacer o qué?";
            } else if (comandoLimpio.includes("nombre")) {
                respuesta = "Yo soy Dimas, tu asistente personal al tiro.";
            } else {
                respuesta = `Recibí tu orden, viejo: '${texto}'. A darle recio.`;
            }

            responseBox.innerText = `Dimas dice: ${respuesta}`;
            hablarDimas(respuesta, () => {
                reiniciarEscucha(); // Reactiva el micrófono al terminar de hablar para la siguiente pregunta
            });
        }

        function procesarTextoInput() {
            const input = document.getElementById("userInput");
            const texto = input.value.trim();
            if (texto) {
                ejecutarComando(texto);
                input.value = "";
            }
        }

        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                procesarTextoInput();
            }
        });
    </script>

</body>
</html>
