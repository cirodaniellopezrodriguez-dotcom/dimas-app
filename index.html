<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #333;
        }
        h2 {
            margin-top: 0;
            color: #ff5252;
            font-size: 22px;
        }
        p {
            font-size: 15px;
            color: #b0b0b0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #ff5252;
        }
        button {
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 6px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:active {
            background-color: #ff1744;
        }
        .btn-mic {
            background-color: #00897b;
            margin-top: 10px;
        }
        .btn-mic.escuchando {
            background-color: #d32f2f;
            animation: latido 1.5s infinite;
        }
        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .btn-grupo {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-grupo button {
            background-color: #333;
            font-size: 14px;
        }
        #response-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #252525;
            border-radius: 8px;
            font-style: italic;
            color: #ffccbc;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-descanso { background-color: #333; color: #aaa; }
        .badge-activo { background-color: #00897b; color: #fff; animation: latido 1.5s infinite; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤠 Dimas</h2>
        <div id="status-badge" class="status-badge badge-descanso">Modo Descanso (Inactivo)</div>
        <p id="status-text">Pícale al botón para activar la escucha de "Dimas".</p>

        <input type="text" id="userInput" placeholder="Escribe tu orden o háblale..." />
        
        <button onclick="procesarTextoInput()">Enviar comando 🚀</button>
        <button id="micBtn" class="btn-mic" onclick="alternarModoEscucha()">🔴 Activar Manos Libres (Escucha "Dimas")</button>

        <div class="btn-grupo">
            <button onclick="ejecutarComando('pon un cronómetro de 1 minuto')">⏱️ Cronómetro 1 min</button>
            <button onclick="ejecutarComando('pon la rolita de cadetes de linares')">🎵 Rolita</button>
        </div>

        <div id="response-box">Aquí ando al pendiente, viejo.</div>
    </div>

    <script>
        let vozActual = null;
        let reconocimiento = null;
        let modoManosLibres = false;
        let esperandoOrden = false;

        function hablarDimas(texto, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                vozActual = new SpeechSynthesisUtterance(texto);
                
                let voces = window.speechSynthesis.getVoices();
                let vozEspanol = voces.find(v => v.lang === 'es-MX' || v.lang.includes('es-US') || v.lang.includes('es-LA')) || voces.find(v => v.lang.includes('es'));
                if (vozEspanol) {
                    vozActual.voice = vozEspanol;
                }

                vozActual.lang = 'es-MX'; 
                vozActual.rate = 1.05; 
                vozActual.pitch = 0.95; 

                if (callback) {
                    vozActual.onend = callback;
                }

                window.speechSynthesis.speak(vozActual);
            } else if (callback) {
                callback();
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-MX';
            reconocimiento.continuous = false;
            reconocimiento.interimResults = false;

            reconocimiento.onresult = function(event) {
                let textoEscuchado = event.results[0][0].transcript.trim().toLowerCase();
                document.getElementById("userInput").value = textoEscuchado;

                if (!esperandoOrden) {
                    if (textoEscuchado.includes("dimas") || textoEscuchado.includes("dimás")) {
                        esperandoOrden = true;
                        actualizarUIActivo("¡Mande, compadre! ¿Qué se ofrece?");
                        hablarDimas("¿Qué pasó, compadre?", () => {
                            reiniciarReconocimiento();
                        });
                    } else {
                        reiniciarReconocimiento();
                    }
                } else {
                    esperandoOrden = false;
                    actualizarUIDescanso();
                    ejecutarComando(textoEscuchado);
                }
            };

            reconocimiento.onerror = function(event) {
                if (modoManosLibres) {
                    setTimeout(reiniciarReconocimiento, 1000);
                }
            };

            reconocimiento.onend = function() {
                if (modoManosLibres && !esperandoOrden) {
                    setTimeout(reiniciarReconocimiento, 500);
                }
            };
        }

        function alternarModoEscucha() {
            if (!reconocimiento) {
                alert("Tu navegador no soporta el reconocimiento de voz por micrófono, viejo.");
                return;
            }

            const btn = document.getElementById("micBtn");
            if (!modoManosLibres) {
                modoManosLibres = true;
                esperandoOrden = false;
                btn.classList.add("escuchando");
                btn.innerText = "🛑 Desactivar Manos Libres";
                actualizarUIDescanso();
                try { reconocimiento.start(); } catch(e) {}
            } else {
                modoManosLibres = false;
                esperandoOrden = false;
                try { reconocimiento.stop(); } catch(e) {}
                btn.classList.remove("escuchando");
                btn.innerText = "🔴 Activar Manos Libres (Escucha 'Dimas')";
                document.getElementById("status-text").innerText = "Manos libres apagado.";
                let badge = document.getElementById("status-badge");
                badge.className = "status-badge badge-descanso";
                badge.innerText = "Modo Descanso (Inactivo)";
            }
        }

        function reiniciarReconocimiento() {
            if (modoManosLibres) {
                try { reconocimiento.start(); } catch(e) {}
            }
        }

        function actualizarUIDescanso() {
            let badge = document.getElementById("status-badge");
            badge.className = "status-badge badge-descanso";
            badge.innerText = "Modo Descanso (Esperando 'Dimas'...)";
            document.getElementById("status-text").innerText = "Di 'Dimas' para despertarme.";
        }

        function actualizarUIActivo(mensaje) {
            let badge = document.getElementById("status-badge");
            badge.className = "status-badge badge-activo";
            badge.innerText = "¡Modo Activo!";
            document.getElementById("status-text").innerText = mensaje;
            document.getElementById("response-box").innerText = `Dimas dice: ${mensaje}`;
        }

        // Función para emitir sonido de alarma (Beep) usando Web Audio API
        function hacerBiip() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880; // Tono agudo de alerta
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.0); // Suena 2 segundos
            } catch(e) {}
        }

        function ejecutarComando(texto) {
            const responseBox = document.getElementById("response-box");
            let respuesta = "";

            let comandoLimpio = texto.replace("dimas", "").replace("dimás", "").trim();

            if (comandoLimpio.includes("reproducir") || comandoLimpio.includes("música") || comandoLimpio.includes("canción") || comandoLimpio.includes("cancion") || comandoLimpio.includes("rola") || comandoLimpio.includes("rolita") || comandoLimpio.includes("pon")) {
                
                let busqueda = comandoLimpio
                    .replace("reproducir", "")
                    .replace("música", "")
                    .replace("canción", "")
                    .replace("cancion", "")
                    .replace("rola", "")
                    .replace("rolita", "")
                    .replace("video", "")
                    .replace("ver", "")
                    .replace("pon", "")
                    .trim();

                if (busqueda) {
                    respuesta = `¡Fierro! Buscando '${busqueda}' para pasarlo a SnapTube, viejo.`;
                    responseBox.innerText = `Dimas dice: ${respuesta}`;
                    hablarDimas(respuesta, () => {
                        setTimeout(() => {
                            let query = encodeURIComponent(busqueda);
                            window.location.href = `https://www.youtube.com/results?search_query=${query}`;
                        }, 500);
                    });
                    return;
                } else {
                    respuesta = "¿Qué rolita quieres que ponga o qué? Dímela bien, viejo.";
                }
            } 
            else if (comandoLimpio.includes("alarma") || comandoLimpio.includes("despertador")) {
                respuesta = "¡Arre pues! Abriendo el reloj para programar tu alarma, viejo.";
                responseBox.innerText = `Dimas dice: ${respuesta}`;
                hablarDimas(respuesta, () => {
                    setTimeout(() => {
                        if (/Android/i.test(navigator.userAgent)) {
                            window.location.href = "intent://#Intent;action=android.intent.action.SET_ALARM;end;";
                        } else {
                            window.open("https://calendar.google.com", "_blank");
                        }
                        reiniciarReconocimiento();
                    }, 500);
                });
                return;
            } 
            // NUEVO: Cronómetro / Temporizador Interno Real
            else if (comandoLimpio.includes("cronómetro") || comandoLimpio.includes("temporizador") || comandoLimpio.includes("cuenta regresiva")) {
                
                // Extraer minutos o segundos de la orden del usuario
                let matchMin = comandoLimpio.match(/(\d+)\s*(minuto|minutos|min)/);
                let matchSeg = comandoLimpio.match(/(\d+)\s*(segundo|segundos|seg)/);
                
                let milisegundos = 60 * 1000; // Por defecto 1 minuto si no especifica
                let textoTiempo = "1 minuto";

                if (matchMin) {
                    let mins = parseInt(matchMin[1]);
                    milisegundos = mins * 60 * 1000;
                    textoTiempo = `${mins} minuto${mins > 1 ? 's' : ''}`;
                } else if (matchSeg) {
                    let segs = parseInt(matchSeg[1]);
                    milisegundos = segs * 1000;
                    textoTiempo = `${segs} segundo${segs > 1 ? 's' : ''}`;
                }

                respuesta = `¡Fierro! Cronómetro puesto de ${textoTiempo}. Yo te aviso cuando caiga el tiempo, viejo.`;
                responseBox.innerText = `Dimas dice: ${respuesta}`;
                
                hablarDimas(respuesta, () => {
                    reiniciarReconocimiento();
                });

                // Activar el temporizador interno en JavaScript
                setTimeout(() => {
                    hacerBiip();
                    hablarDimas(`¡Tiempo cumplido, compadre! Se acabó el cronómetro de ${textoTiempo}. ¡Despierta!`);
                    document.getElementById("response-box").innerText = `⏰ ¡TIEMPO CUMPLIDO (${textoTiempo})!`;
                }, milisegundos);

                return;
            }
            else if (comandoLimpio.includes("hola") || comandoLimpio.includes("que onda")) {
                respuesta = "¡Qué onda, compadre! ¿Qué vamos a hacer o qué?";
            } else if (comandoLimpio.includes("nombre")) {
                respuesta = "Yo soy Dimas, tu asistente personal al tiro.";
            } else {
                respuesta = `Recibí tu orden, viejo: '${texto}'. A darle recio.`;
            }

            responseBox.innerText = `Dimas dice: ${respuesta}`;
            hablarDimas(respuesta, () => {
                actualizarUIDescanso();
                reiniciarReconocimiento();
            });
        }

        function procesarTextoInput() {
            const input = document.getElementById("userInput");
            const texto = input.value.trim();
            if (texto) {
                ejecutarComando(texto);
                input.value = "";
            }
        }

        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                procesarTextoInput();
            }
        });
    </script>

</body>
</html>
