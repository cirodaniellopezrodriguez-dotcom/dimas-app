<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas - Conversación</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #333;
        }
        h2 { margin-top: 0; color: #ff5252; font-size: 22px; }
        p { font-size: 15px; color: #b0b0b0; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"]:focus { outline: none; border-color: #ff5252; }
        button {
            background-color: #00897b;
            color: white;
            border: none;
            padding: 14px 20px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button.activo { background-color: #d32f2f; animation: latido 1.5s infinite; }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        #response-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #252525;
            border-radius: 8px;
            font-style: italic;
            color: #ffccbc;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤠 Dimas</h2>
        <p id="status-text">Pícale para iniciar la plática.</p>
        <input type="text" id="userInput" placeholder="Escribe algo..." />
        <button onclick="procesarTexto()">Enviar 🚀</button>
        <button id="btnConversar" onclick="alternarConversacion()">🎙️ Iniciar Conversación</button>
        <div id="response-box">Aquí ando al pendiente, viejo.</div>
    </div>

    <script>
        let reconocimiento = null;
        let conversando = false;
        let hablandoDimas = false;

        function hablar(texto, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                hablandoDimas = true;
                if (reconocimiento) { try { reconocimiento.stop(); } catch(e) {} }

                let utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-MX';
                utterance.rate = 1.05;
                utterance.pitch = 0.95;

                utterance.onend = () => { hablandoDimas = false; if (callback) callback(); };
                utterance.onerror = () => { hablandoDimas = false; if (callback) callback(); };

                window.speechSynthesis.speak(utterance);
            } else if (callback) { callback(); }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-MX';
            reconocimiento.continuous = false;
            reconocimiento.interimResults = false;

            reconocimiento.onresult = (event) => {
                if (hablandoDimas) return;
                let texto = event.results[0][0].transcript.trim();
                
                // Ya no rellenamos el input con lo que dijo el usuario para evitar que se repita o estorbe
                document.getElementById("userInput").value = ""; 

                // Mandamos directo la pregunta a la lógica sin repetir nada
                responderPregunta(texto);
            };

            reconocimiento.onerror = () => {
                if (conversando && !hablandoDimas) { setTimeout(reiniciarMicro, 800); }
            };

            reconocimiento.onend = () => {
                if (conversando && !hablandoDimas) { setTimeout(reiniciarMicro, 500); }
            };
        }

        function alternarConversacion() {
            if (!reconocimiento) { alert("Tu navegador no soporta voz."); return; }
            const btn = document.getElementById("btnConversar");

            if (!conversando) {
                conversando = true;
                btn.classList.add("activo");
                btn.innerText = "🛑 Detener Conversación";
                hablar("¡Qué onda, compadre! ¿De qué platicamos?", reiniciarMicro);
            } else {
                conversando = false;
                try { reconocimiento.stop(); } catch(e) {}
                btn.classList.remove("activo");
                btn.innerText = "🎙️ Iniciar Conversación";
                document.getElementById("status-text").innerText = "Plática pausada.";
            }
        }

        function reiniciarMicro() {
            if (conversando && !hablandoDimas) {
                try { reconocimiento.abort(); setTimeout(() => { if (conversando && !hablandoDimas) reconocimiento.start(); }, 300); } catch(e) {}
            }
        }

        // CEREBRO DE CONVERSACIÓN (Directo y sin repetir tu frase)
        function responderPregunta(pregunta) {
            let p = pregunta.toLowerCase().trim();
            let respuesta = "";

            if (p.includes("hola") || p.includes("que onda") || p.includes("qué onda")) {
                respuesta = "¡Qué onda, compadre! ¿Cómo va todo?";
            } else if (p.includes("cómo estás") || p.includes("como estas")) {
                respuesta = "Aquí andando al tiro, viejo, listo para cotorrear un rato.";
            } else if (p.includes("cómo te llamas") || p.includes("tu nombre")) {
                respuesta = "Me llamo Dimas, tu compadre y asistente personal.";
            } else if (p.includes("qué hora es") || p.includes("que hora es")) {
                let d = new Date();
                respuesta = "Son las " + d.getHours() + " con " + d.getMinutes() + " minutos, compadre.";
            } else if (p.includes("qué haces") || p.includes("que haces")) {
                respuesta = "Aquí nomás platicando contigo, viejo.";
            } else {
                // Respuesta abierta natural sin repetir lo que dijiste
                respuesta = " Simón, te escucho con eso. Cuéntame más detalles, viejo.";
            }

            document.getElementById("response-box").innerText = "Dimas dice: " + respuesta;
            hablar(respuesta, reiniciarMicro);
        }

        function procesarTexto() {
            let input = document.getElementById("userInput");
            let texto = input.value.trim();
            if (texto) {
                responderPregunta(texto);
                input.value = "";
            }
        }

        document.getElementById("userInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") { procesarTexto(); }
        });
    </script>
</body>
</html>
